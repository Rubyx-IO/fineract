name: Publish Fineract to Rubyx GCP Artifact Registry

on:
  push:
    branches:
      - rubyx-*

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      REGION: europe-west1
      PROJECT_ID: ${{ vars.ARTIFACT_PROJECT_ID }}
      CONTAINER_REGISTRY: ${{ vars.ARTIFACT_CONTAINER_REGISTRY }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.ARTIFACT_WIP }}
          service_account: ${{ vars.ARTIFACT_GCP_SA }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Configure Docker for GCP
        run: gcloud info && gcloud auth configure-docker "$CONTAINER_REGISTRY"
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"
      - name: Build and Push to GCP Artifact Registry
        env:
          IMAGE_TAG: ${{ steps.extract_branch.outputs.branch }}
        run: |
          ./gradlew --no-daemon --console=plain :fineract-provider:jib -x test -x cucumber \
          -Djib.to.image="$CONTAINER_REGISTRY/$PROJECT_ID/fineract/server" \
          -Djib.to.tags="$IMAGE_TAG" \
          -Djib.from.platforms=linux/amd64,linux/arm64
